<svg width="1400" height="1060" viewBox="0 0 1400 1060" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>GitHub API Copilot — Full Architecture</title>
<rect width="1400" height="1060" fill="#FFFFFF"/>

<text x="700" y="45" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">GitHub API Copilot</text>
<text x="700" y="72" text-anchor="middle" font-size="15" fill="#6B7280">Grounded RAG Architecture Diagram</text>

<circle cx="115" cy="128" r="16" fill="#374151"/>
<rect x="98" y="150" width="34" height="38" rx="8" fill="#374151"/>
<text x="115" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">USER</text>
<line x1="115" y1="210" x2="115" y2="228" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#374151" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- FRONTEND -->
<rect x="60" y="230" width="380" height="430" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" rx="6"/>
<rect x="60" y="230" width="380" height="40" fill="#1D4ED8" rx="6"/>
<rect x="60" y="255" width="380" height="15" fill="#1D4ED8"/>
<text x="250" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">FRONTEND (Vanilla JS SPA)</text>

<rect x="80" y="290" width="340" height="70" rx="6" fill="#DBEAFE" stroke="#3B82F6"/>
<text x="250" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Question Input</text>
<text x="250" y="332" text-anchor="middle" font-size="11" fill="#1E40AF">example chips · client-side length check</text>
<line x1="250" y1="360" x2="250" y2="378" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="80" y="390" width="340" height="70" rx="6" fill="#DBEAFE" stroke="#3B82F6"/>
<text x="250" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Answer Renderer</text>
<text x="250" y="432" text-anchor="middle" font-size="11" fill="#1E40AF">citation pills · hallucination warning badge</text>
<line x1="250" y1="460" x2="250" y2="478" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="80" y="490" width="340" height="70" rx="6" fill="#DBEAFE" stroke="#3B82F6"/>
<text x="250" y="512" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Fetch API Client</text>
<text x="250" y="532" text-anchor="middle" font-size="11" fill="#1E40AF">POST /query · handles 422 / 429 / 500</text>

<line x1="440" y1="445" x2="475" y2="445" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

<!-- BACKEND -->
<rect x="480" y="230" width="420" height="430" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" rx="6"/>
<rect x="480" y="230" width="420" height="40" fill="#C2410C" rx="6"/>
<rect x="480" y="255" width="420" height="15" fill="#C2410C"/>
<text x="690" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">API BACKEND (FastAPI)</text>

<rect x="500" y="290" width="380" height="70" rx="6" fill="#FFEDD5" stroke="#F97316"/>
<text x="690" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">Input Validation</text>
<text x="690" y="332" text-anchor="middle" font-size="11" fill="#C2410C">Pydantic · 3–500 chars · rejects blank</text>
<line x1="690" y1="360" x2="690" y2="378" stroke="#F97316" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="500" y="390" width="380" height="70" rx="6" fill="#FFEDD5" stroke="#F97316"/>
<text x="690" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">Rate Limiter</text>
<text x="690" y="432" text-anchor="middle" font-size="11" fill="#C2410C">slowapi · 10 requests / min per IP</text>
<line x1="690" y1="460" x2="690" y2="478" stroke="#F97316" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="500" y="490" width="380" height="70" rx="6" fill="#FFEDD5" stroke="#F97316"/>
<text x="690" y="512" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">/query Endpoint</text>
<text x="690" y="532" text-anchor="middle" font-size="11" fill="#C2410C">orchestrates retrieval + generation</text>

<line x1="690" y1="660" x2="690" y2="698" stroke="#F97316" stroke-width="2" marker-end="url(#a)"/>
<line x1="900" y1="445" x2="935" y2="445" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

<!-- RETRIEVAL & GENERATION -->
<rect x="940" y="230" width="400" height="430" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" rx="6"/>
<rect x="940" y="230" width="400" height="40" fill="#047857" rx="6"/>
<rect x="940" y="255" width="400" height="15" fill="#047857"/>
<text x="1140" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">RETRIEVAL &amp; GENERATION</text>

<rect x="960" y="290" width="360" height="70" rx="6" fill="#D1FAE5" stroke="#10B981"/>
<text x="1140" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">Hybrid Search</text>
<text x="1140" y="332" text-anchor="middle" font-size="11" fill="#047857">BM25 + vector, RRF-fused · top-5</text>
<line x1="1140" y1="360" x2="1140" y2="378" stroke="#10B981" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="960" y="390" width="360" height="70" rx="6" fill="#D1FAE5" stroke="#10B981"/>
<text x="1140" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">LLM Generation</text>
<text x="1140" y="432" text-anchor="middle" font-size="11" fill="#047857">Groq · temperature=0 · forced JSON</text>
<line x1="1140" y1="460" x2="1140" y2="478" stroke="#10B981" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="960" y="490" width="360" height="70" rx="6" fill="#D1FAE5" stroke="#10B981"/>
<text x="1140" y="512" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">Citation Validator</text>
<text x="1140" y="532" text-anchor="middle" font-size="11" fill="#047857">flags any URL not actually retrieved</text>

<line x1="935" y1="325" x2="912" y2="325" stroke="#374151" stroke-width="1.5"/>
<line x1="912" y1="325" x2="912" y2="800" stroke="#374151" stroke-width="1.5"/>
<line x1="912" y1="800" x2="904" y2="800" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

<line x1="1140" y1="660" x2="1140" y2="698" stroke="#10B981" stroke-width="2" marker-end="url(#a)"/>

<!-- DATA STORE -->
<rect x="480" y="700" width="420" height="200" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5" rx="6"/>
<rect x="480" y="700" width="420" height="40" fill="#0F766E" rx="6"/>
<rect x="480" y="725" width="420" height="15" fill="#0F766E"/>
<text x="690" y="725" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">VECTOR STORE (ChromaDB)</text>
<rect x="500" y="760" width="380" height="115" rx="6" fill="#CCFBF1" stroke="#0D9488"/>
<text x="690" y="782" text-anchor="middle" font-size="13" font-weight="700" fill="#134E4A">github_api_docs collection</text>
<text x="690" y="802" text-anchor="middle" font-size="11" fill="#0F766E">1,328 chunks · bge-small-en-v1.5 embeddings</text>
<text x="690" y="822" text-anchor="middle" font-size="11" fill="#0F766E">built once, offline, persisted locally</text>

<!-- EXTERNAL SERVICE -->
<rect x="940" y="700" width="400" height="200" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" rx="6"/>
<rect x="940" y="700" width="400" height="40" fill="#B45309" rx="6"/>
<rect x="940" y="725" width="400" height="15" fill="#B45309"/>
<text x="1140" y="725" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">EXTERNAL SERVICE</text>
<rect x="960" y="760" width="360" height="115" rx="6" fill="#FEF3C7" stroke="#F59E0B"/>
<text x="1140" y="782" text-anchor="middle" font-size="13" font-weight="700" fill="#78350F">Groq API</text>
<text x="1140" y="802" text-anchor="middle" font-size="11" fill="#B45309">openai/gpt-oss-20b · hosted inference</text>
<text x="1140" y="822" text-anchor="middle" font-size="11" fill="#B45309">free tier, rate &amp; daily-quota limited</text>

