<text x="150" y="1006" font-size="10" fill="#6B7280">validated + rate-limited</text>
<line x1="330" y1="995" x2="380" y2="995" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)"/>

<circle cx="440" cy="995" r="16" fill="#047857"/><text x="440" y="1000" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<text x="470" y="990" font-size="13" font-weight="700" fill="#065F46">HYBRID RETRIEVAL</text>
<text x="470" y="1006" font-size="10" fill="#6B7280">BM25 + vector, RRF</text>
<line x1="650" y1="995" x2="700" y2="995" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)"/>

<circle cx="760" cy="995" r="16" fill="#047857"/><text x="760" y="1000" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<text x="790" y="990" font-size="13" font-weight="700" fill="#065F46">GROUNDED GENERATION</text>
<text x="790" y="1006" font-size="10" fill="#6B7280">context-only, temp=0</text>
<line x1="1010" y1="995" x2="1060" y2="995" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)"/>

<circle cx="1120" cy="995" r="16" fill="#C2410C"/><text x="1120" y="1000" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
<text x="1150" y="990" font-size="13" font-weight="700" fill="#9A3412">CITATION CHECK &amp; DISPLAY</text>
<text x="1150" y="1006" font-size="10" fill="#6B7280">flags unverified sources</text>
